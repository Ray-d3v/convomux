name: Publish reviewed npm package
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package.json version approved for npm publication
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    if: vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: convomux-package
          path: package
      - name: Require owner release decisions
        env:
          APPROVED_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('package.json')); if(p.private || !p.license || p.license==='UNLICENSED' || p.version!==process.env.APPROVED_VERSION) throw Error('Owner name/license/version decisions are required');"
          node --version
          npm --version
      - name: Publish the CI verified artifact with OIDC
        run: npm publish package/*.tgz --access public --provenance --ignore-scripts
