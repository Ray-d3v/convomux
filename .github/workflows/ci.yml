name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: node dist/cli.js --help
  secure-slk:
    needs: check
    uses: ./.github/workflows/secure-slk.yml
  package:
    needs: [check, secure-slk]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - uses: actions/download-artifact@v4
        with:
          pattern: secure-slk-*
          path: .upstream/secure-build
          merge-multiple: true
      - run: npm run backends:prepare
      - run: npm run backends:verify
      - run: npm pack
      - run: npm run package:smoke
      - uses: actions/upload-artifact@v4
        with:
          name: convomux-package
          path: .upstream/package/*
          include-hidden-files: true
          if-no-files-found: error
  native-package:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel, ubuntu-latest, ubuntu-24.04-arm]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: convomux-package
          path: .upstream/package
      - name: Install and execute the exact prepared tgz
        run: npm run package:smoke -- --existing
